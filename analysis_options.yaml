# Configuración del analizador de Dart para calidad moderada del código.
# Proporciona análisis estático para detectar errores críticos y mantener buenas prácticas.
#
# Ejecutar análisis: flutter analyze
# Aplicar correcciones automáticas: dart fix --apply

# Incluye el conjunto de reglas recomendadas de Flutter
include: package:flutter_lints/flutter.yaml

# Configuración del analizador
analyzer:
  # Excluir archivos generados automáticamente
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "build/**"
  
  # Configuración de lenguaje - moderadamente estricto
  language:
    strict-casts: true
    strict-inference: false  # Permitir algo de inferencia automática
    strict-raw-types: false  # No ser tan estricto con tipos genéricos
  
  # Configuración de severidad de errores
  errors:
    # Ignorar advertencias menos críticas
    invalid_annotation_target: ignore
    todo: ignore
    
    # Mantener advertencias importantes
    deprecated_member_use: warning
    missing_required_param: error
    missing_return: error
    avoid_print: error  # Forzar uso de logger
    
    # Advertir sobre código no utilizado
    dead_code: warning
    unused_import: warning
    unused_local_variable: info
    unused_element: info

# Reglas de linting - solo las más importantes para calidad moderada
linter:
  rules:
    # === REGLAS CRÍTICAS DE CORRECCIÓN ===
    # Prevenir errores y bugs
    - avoid_empty_else
    - avoid_print  # Usar logging apropiado
    - avoid_relative_lib_imports
    - avoid_returning_null_for_void
    - avoid_types_as_parameter_names
    - cancel_subscriptions
    - close_sinks
    - control_flow_in_finally
    - empty_catches
    - empty_statements
    - hash_and_equals
    - no_duplicate_case_values
    - throw_in_finally
    - unrelated_type_equality_checks
    - valid_regexps
    - always_require_non_null_named_parameters
    
    # === SEGURIDAD Y MEJORES PRÁCTICAS ===
    - use_build_context_synchronously
    - avoid_init_to_null
    - prefer_is_empty
    - prefer_is_not_empty
    - await_only_futures
    - unawaited_futures
    
    # === NOMBRES Y CONVENCIONES ===
    - camel_case_types
    - file_names
    - non_constant_identifier_names
    - constant_identifier_names
    - library_names
    - library_prefixes
    
    # === FLUTTER ESPECÍFICO ===
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_key_in_widget_constructors
    - sort_child_properties_last
    - use_full_hex_values_for_flutter_colors
    
    # === MANTENIBILIDAD BÁSICA ===
    - annotate_overrides
    - avoid_null_checks_in_equality_operators
    - avoid_shadowing_type_parameters
    - curly_braces_in_flow_control_structures
    - empty_constructor_bodies
    - prefer_collection_literals
    - prefer_conditional_assignment
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_if_null_operators
    - prefer_null_aware_operators
    - unnecessary_null_in_if_null_operators
    - unnecessary_this
    - use_super_parameters
    
    # === LIMPIEZA DE CÓDIGO ===
    - unnecessary_brace_in_string_interps
    - unnecessary_const
    - unnecessary_new
    - unnecessary_null_aware_assignments
    - unnecessary_overrides
    - unnecessary_parenthesis
    - unnecessary_statements
    
    # === RENDIMIENTO ===
    - prefer_const_literals_to_create_immutables
    - prefer_spread_collections
    - prefer_inlined_adds
    
    # Reglas deshabilitadas para flexibilidad moderada:
    # - prefer_single_quotes (permitir comillas dobles)
    # - lines_longer_than_80_chars (permitir líneas más largas)
    # - prefer_expression_function_bodies (permitir ambos estilos)
    # - sort_constructors_first (no forzar orden estricto)
    # - require_trailing_commas (no requerir comas finales)
    # - directives_ordering (no forzar orden de imports)
    # - omit_local_variable_types (permitir tipos explícitos)

# Más información sobre reglas de linting: https://dart.dev/lints